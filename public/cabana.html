<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#101c22" />
  <title>Conserje de la cabaña</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="loading" class="loading"><span class="loader"></span></div>

  <main id="app" hidden>
    <div id="home">
    <header class="hero" id="hero">
      <svg class="scene" viewBox="0 0 400 340" preserveAspectRatio="xMidYMin slice" aria-hidden="true">
        <defs>
          <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#0d1a22"/><stop offset=".55" stop-color="#2a3f4d"/><stop offset=".85" stop-color="#b98a6e"/><stop offset="1" stop-color="#e2b48c"/>
          </linearGradient>
          <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#5d6f78"/><stop offset="1" stop-color="#101c22"/>
          </linearGradient>
          <linearGradient id="cone" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#3a4b55"/><stop offset=".55" stop-color="#26343c"/><stop offset="1" stop-color="#1b262d"/>
          </linearGradient>
          <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
            <stop offset=".5" stop-color="#101c22" stop-opacity="0"/><stop offset=".8" stop-color="#101c22" stop-opacity=".85"/><stop offset="1" stop-color="#101c22"/>
          </linearGradient>
        </defs>
        <rect width="400" height="340" fill="url(#sky)"/>
        <g class="stars" fill="#f3efe6">
          <circle cx="40" cy="30" r=".9"/><circle cx="92" cy="58" r=".7"/><circle cx="150" cy="22" r="1"/><circle cx="230" cy="44" r=".7"/><circle cx="300" cy="18" r="1"/><circle cx="352" cy="62" r=".8"/><circle cx="270" cy="84" r=".6"/><circle cx="20" cy="90" r=".6"/><circle cx="380" cy="32" r=".7"/>
        </g>
        <path d="M0 236 L38 214 L62 220 L96 196 L128 212 L150 206 L170 222 L0 240Z" fill="#33454f" opacity=".75"/>
        <path d="M330 214 L352 204 L372 210 L400 198 L400 240 L300 240Z" fill="#33454f" opacity=".7"/>
        <path d="M110 240 L196 132 Q205 124 214 132 L304 240Z" fill="url(#cone)"/>
        <path d="M168 168 L196 132 Q205 124 214 132 L243 168 L232 162 L224 172 L214 160 L204 174 L194 160 L184 171 L177 162Z" fill="#eef0ee"/>
        <path d="M204 132 Q205 126 214 132 L243 168 L232 162 L224 172 L214 160Z" fill="#c9d3d6" opacity=".6"/>
        <rect y="238" width="400" height="200" fill="url(#lake)"/>
        <g stroke="#e2b48c" stroke-linecap="round" opacity=".35">
          <line x1="150" y1="252" x2="262" y2="252" stroke-width="1.2"/><line x1="170" y1="264" x2="240" y2="264"/><line x1="186" y1="276" x2="226" y2="276"/>
        </g>
        <path d="M0 300 L14 284 L20 292 L30 270 L40 290 L52 276 L60 296 L72 280 L84 300Z M316 302 L330 282 L338 294 L350 268 L360 290 L372 274 L384 296 L400 278 L400 310Z" fill="#0b1419"/>
        <rect width="400" height="340" fill="url(#fade)"/>
      </svg>

      <div class="topbar">
        <div class="brand"><span class="mono" id="mono"></span><span data-i18n="concierge"></span></div>
        <label class="lang">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 3.6 5.7 3.6 9s-1.1 6.3-3.6 9c-2.5-2.7-3.6-5.7-3.6-9S9.5 5.7 12 3z"/></svg>
          <select id="lang" aria-label="Idioma">
            <option value="es">Español</option><option value="en">English</option><option value="pt">Português</option>
            <option value="de">Deutsch</option><option value="it">Italiano</option><option value="fr">Français</option>
          </select>
        </label>
      </div>

      <div class="hero-text">
        <p class="greet" id="greet"></p>
        <p class="eyebrow" id="lugar">Puerto Varas · Lago Llanquihue</p>
        <h1 id="nombre"></h1>
        <p class="lede" id="descripcion"></p>
        <div class="hero-chips" id="hero-chips"></div>
      </div>
    </header>

    <div class="wrap">
      <section class="stay" aria-label="Estadía">
        <div class="stay-times">
          <div><span class="label">Check-in</span><strong id="checkin"></strong></div>
          <div class="arrow"><svg viewBox="0 0 24 24"><path d="M4 12h15m-5-5 5 5-5 5"/></svg></div>
          <div><span class="label">Check-out</span><strong id="checkout"></strong></div>
        </div>
        <div class="stay-wifi">
          <div class="wifi-icon"><svg viewBox="0 0 24 24"><path d="M2.5 9a14 14 0 0 1 19 0M5.5 12.5a9.5 9.5 0 0 1 13 0M8.6 15.8a5 5 0 0 1 6.8 0"/><circle cx="12" cy="19" r="1.2" fill="currentColor" stroke="none"/></svg></div>
          <div class="wifi-text">
            <span class="label" id="wifi-red"></span>
            <strong id="wifi-clave"></strong>
          </div>
          <button class="copy" id="copy-wifi"><svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2.5"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg><span data-i18n="copy"></span></button>
        </div>
      </section>

      <nav class="actions" id="actions"></nav>

      <h2 class="need" id="need"></h2>
      <nav class="tiles" id="tiles"></nav>

      <section class="strip" id="picks"></section>
      <section class="strip" id="special"></section>

      <footer class="foot">
        <span id="foot-name"></span>
        <span data-i18n="footer"></span>
        <a class="host-link" id="host-link" href="/admin">Acceso anfitrión</a>
      </footer>
    </div>
    </div>

    <div id="page" hidden>
      <header class="pagebar">
        <a href="#" class="back" aria-label="Volver"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg><span id="page-back-label"></span></a>
        <strong id="page-name"></strong>
        <span class="mono small" id="page-mono"></span>
      </header>
      <div class="wrap">
        <div class="page-head"><span class="page-ico" id="page-ico"></span><h1 class="page-title" id="page-title"></h1></div>
        <div id="page-body"></div>
        <div id="page-next"></div>
      </div>
    </div>
  </main>

  <button id="open-chat" class="askbar" hidden>
    <span class="ask-orb"><svg viewBox="0 0 24 24"><path d="M12 3l1.8 4.9L19 9.7l-4.9 1.8L12 16.5l-1.8-5L5 9.7l5.2-1.8z"/><path d="M19 15l.7 1.8 1.8.7-1.8.7L19 20l-.7-1.8-1.8-.7 1.8-.7z"/></svg></span>
    <span class="ask-text" data-i18n="ask"></span>
    <span class="ask-go"><svg viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></span>
  </button>

  <div id="chat" class="chat" hidden role="dialog" aria-modal="true">
    <div class="chat-head">
      <button id="close-chat" class="icon-btn" aria-label="Cerrar"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <span class="avatar" id="chat-mono"></span>
      <div class="chat-id">
        <strong data-i18n="concierge"></strong>
        <span class="chat-sub"><i class="dot"></i><span id="chat-sub"></span></span>
      </div>
    </div>
    <div id="messages" class="messages" aria-live="polite"></div>
    <div id="chips" class="chips"></div>
    <form id="chat-form" class="chat-form">
      <input id="chat-input" autocomplete="off" maxlength="1000" />
      <button type="submit" class="send" aria-label="Enviar"><svg viewBox="0 0 24 24"><path d="M12 19V5m-6 6 6-6 6 6"/></svg></button>
    </form>
  </div>

  <div id="qr-sheet" class="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="qr-title">
    <div class="sheet-card">
      <button class="icon-btn sheet-x" id="qr-close" aria-label="Cerrar"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <h3 id="qr-title"></h3>
      <div class="qr-code" id="qr-code"></div>
      <div class="qr-data"><span id="qr-net"></span><strong id="qr-pass"></strong></div>
      <p id="qr-hint"></p>
    </div>
  </div>

  <script src="/vendor/qrcode.js"></script>
  <script src="/app.js" type="module"></script>
</body>
</html>
